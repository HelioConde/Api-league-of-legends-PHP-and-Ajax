name: League Friends - testes e auditoria visual
on:
  push:
    branches: [main, "feat/**", "qa/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Gerar galeria de capturas e relatorio
        if: always()
        run: npm run qa:report
      - name: Anexar screenshots e diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-friends-visual-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
